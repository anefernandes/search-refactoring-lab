server:
  port: 8080
  error:
    include-message: never

spring:
  application:
    name: search-refactoring-lab
  datasource:
    url: jdbc:h2:mem:searchlab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

searchlab:
  executor:
    # Intentional baseline issue: one shared pool for blocking I/O and CPU-bound work.
    threads: 8
  external-providers:
    catalog-delay-ms: 70
    pricing-delay-ms: 130
    reviews-delay-ms: 190
